# Seed registry of sweeps-casino sites known to gamba_pick.
#
# Lifted from the casinos_master.yaml in the prior casino_automation
# project (cycle-five/casino_automation). Pure data — names, URLs,
# affiliate links, and a status flag indicating where each site sits
# in the implementation pipeline. The runner consults this list to
# decide what to attempt; configs / modules for working sites live in
# their own .py files at the top level of this repo.
#
# status:
#   working    — Python module exists in this repo and runs end-to-end
#                (login, balance read, daily-claim attempt, clean exit).
#   commercial — Working module exists, but as part of the Casino Buddy
#                commercial catalog rather than this open-source repo.
#                Listed here for visibility into what's covered; the
#                runner ignores ``commercial`` entries unless pointed
#                at the bundled catalog with ``--config-dir`` /
#                ``--seed-file``.
#   juicy      — priority site to add next. Mix of operators (e.g.
#                RealPlay's RealPrize/LoneStar; YayCasino TBD); whether
#                the SLNGApp-platform selectors apply needs to be
#                checked per site by inspecting the /login redirect's
#                client_id.
#   surveyed   — in the master list, no module yet, no priority assigned.
#   unknown    — site exists but its claim flow hasn't been mapped (the
#                old project carried these as ``manual_input`` stubs).
#
# auth (only meaningful when status="working"):
#   oauth — site uses Google OAuth; runner passes --google-oauth.
#   form  — site uses email+password; runner relies on
#           <SITEID>_USERNAME / <SITEID>_PASSWORD env vars (read by
#           ``casino.get_credentials`` via the URL-derived prefix).
#   default is "oauth".
#
# affiliate_link: kept for reference; affiliate-coded URLs are tied
# to the operator's account in the old project. Not used by the
# runner today.
#
# timeout_s (optional): per-site subprocess timeout override.
# Defaults to the runner's ``--timeout-per-site`` value (300s).
# Set tighter for sites with predictable teardown hangs (e.g. zula
# via the scrapling/Camoufox redirect-response interaction): pick
# a value just above typical work duration so SIGKILL fires shortly
# after the DONE marker rather than waiting out the global default.

