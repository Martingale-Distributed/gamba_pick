#[build-system]
#requires = ["setuptools>=61.0", "wheel"]
#build-backend = "setuptools.build_meta"

[project]
name = "gamba_pick"
version = "0.0.1"
description = "Auto Gamba for Fun and Profit"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "Cycle Five", email = "cycle.five@proton.me" }]
maintainers = [{ name = "Cycle Five", email = "cycle.five@proton.me" }]
keywords = [
    "web-scraping",
    "scraping",
    "automation",
    "browser-automation",
    "data-extraction",
    "html-parsing",
    "undetectable",
    "playwright",
    "selenium-alternative",
    "web-crawler",
    "browser",
    "crawling",
]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    # "Development Status :: 6 - Mature",
    # "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "pyotp>=2.9.0",
    "click>=8.3.0",
    "curl_cffi>=0.13.0",
    "playwright>=1.55.0",
    "patchright>=1.55.2",
    "camoufox>=0.4.11",
    "geoip2>=5.1.0",
    "msgspec>=0.19.0",
    "scrapling @ git+https://github.com/cycle-five/Scrapling.git@main",

]

[project.optional-dependencies]
shell = [
    "IPython>=8.37",      # The last version that supports Python 3.10
    "markdownify>=1.2.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.6.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",      # Parallel test execution
    "hypothesis>=6.100.0",       # Property-based testing
    "freezegun>=1.5.0",          # Time mocking
    "responses>=0.25.0",         # HTTP mocking
]

[project.urls]
Homepage = "https://github.com/Martingale-Distributed/gamba_pick"
Documentation = "https://gamba-pick.readthedocs.io/en/latest/"
Repository = "https://github.com/Martingale-Distributed/gamba_pick"
"Bug Tracker" = "https://github.com/Martingale-Distributed/gamba_pick/issues"

[project.scripts]
scrapling = "gamba_pick.cli:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gamba_pick*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests that don't require browser automation",
    "integration: Integration tests with mocked browser",
    "e2e: End-to-end tests requiring real browser and credentials",
    "slow: Tests that take a long time to run",
    "requires_credentials: Tests that require casino/faucet credentials",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/test_*.py",
    "*_test.py",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
