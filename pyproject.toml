#[build-system]
#requires = ["setuptools>=61.0", "wheel"]
#build-backend = "setuptools.build_meta"

[project]
name = "gamba_pick"
# Static version instead of dynamic version so we can get better layer caching while building docker, check the docker file to understand
version = "0.0.1"
description = "Auto Gamba for Fun and Profit"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "Cycle Five", email = "cycle.five@proton.me" }]
maintainers = [{ name = "Cycle Five", email = "cycle.five@proton.me" }]
keywords = [
    "web-scraping",
    "scraping",
    "automation",
    "browser-automation",
    "data-extraction",
    "html-parsing",
    "undetectable",
    "playwright",
    "selenium-alternative",
    "web-crawler",
    "browser",
    "crawling",
]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    # "Development Status :: 6 - Mature",
    # "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "pyotp>=2.9.0",
    "click>=8.3.0",
    "curl_cffi>=0.13.0",
    "playwright>=1.55.0",
    "patchright>=1.55.2",
    "camoufox>=0.4.11",
    "geoip2>=5.1.0",
    "msgspec>=0.19.0",
    "scrapling @ file:///home/lothrop/src/Scrapling.worktrees/dev2",

]

[project.optional-dependencies]
shell = [
    "IPython>=8.37",      # The last version that supports Python 3.10
    "markdownify>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/cycle-five/gamba_pick"
Documentation = "https://gamba-pick.readthedocs.io/en/latest/"
Repository = "https://github.com/cycle-five/gamba_pick"
"Bug Tracker" = "https://github.com/cycle-five/gamba_pick/issues"

[project.scripts]
scrapling = "gamba_pick.cli:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gamba_pick*"]
